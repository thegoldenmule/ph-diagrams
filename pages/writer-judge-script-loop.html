<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .card-title {
      margin-bottom: var(--space-lg);
    }
    .frame {
      max-width: 900px;
    }
    .card {
      height: auto;
    }
    .card-body {
      flex: none;
    }

    /* Vertical spine: Recipe on top, loop in the middle, README at the bottom */
    .spine {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Shared box style */
    .box {
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: var(--space-lg) var(--space-md);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .box.accent-cyan   { border-color: var(--accent-cyan);   background: var(--accent-cyan-bg);   color: var(--accent-cyan); }
    .box.accent-blue   { border-color: var(--accent-blue);   background: var(--accent-blue-bg);   color: var(--accent-blue); }
    .box.accent-green  { border-color: var(--accent-green);  background: var(--accent-green-bg);  color: var(--accent-green); }
    .box.accent-purple { border-color: var(--accent-purple); background: var(--accent-purple-bg); color: var(--accent-purple); }

    .box-title {
      font-size: 15px;
      font-weight: var(--font-weight-semibold);
    }

    /* Spine endpoints get a fixed width so the column reads as one axis */
    .box.endpoint {
      width: 180px;
    }

    /*
     * The script is not an agent — neutral fill and a monospace label so it
     * reads as deterministic machinery next to the coloured LLM boxes.
     */
    .box.script {
      border-color: var(--border-glass);
      background: var(--bg-elevated);
      color: var(--text-primary);
    }
    .box.script .box-title {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 14px;
      letter-spacing: var(--letter-spacing-normal);
    }

    /* ── Vertical spine connector ── */
    .v-connector {
      position: relative;
      width: 3px;
      height: 38px;
      background: var(--text-primary);
      flex-shrink: 0;
    }
    .v-connector::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--text-primary);
    }
    /* Label sits beside the vertical line so it never covers the arrow */
    .v-label {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
    }

    /* The exit gate rides on the outgoing spine arrow */
    .gate-label {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--accent-green);
      background: var(--accent-green-bg);
      border: 1px solid var(--accent-green);
      border-radius: var(--radius-xs);
      padding: 2px 7px;
      letter-spacing: 0.03em;
      white-space: nowrap;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* ── The loop: the three pieces that iterate ── */
    .loop-group {
      position: relative;
      width: 100%;
      border: 1px dashed var(--border-glass);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
    }
    .loop-group-label {
      position: absolute;
      top: -8px;
      left: var(--space-lg);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--bg-surface);
      padding: 0 var(--space-sm);
    }

    /*
     * Both inner rows share the same fixed column template so the return-path
     * verticals land dead-centre under the boxes above them.
     * 180 + 44 + 180 + 96 + 180 = 680, + 4 x 14px gaps = 736.
     * The 96px arrow column is sized to hold the "draft + metrics" label.
     */
    .loop-row, .return-path {
      display: grid;
      grid-template-columns: 180px 44px 180px 96px 180px;
      column-gap: 14px;
      width: 736px;
      margin-left: auto;
      margin-right: auto;
    }

    .loop-row {
      align-items: stretch;
    }

    /* Horizontal connector arrow with label above it */
    .h-connector {
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .h-connector-label {
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
    }
    .h-connector-line {
      width: 100%;
      height: 3px;
      background: var(--text-primary);
      position: relative;
    }
    .h-connector-line::after {
      content: '';
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 8px solid var(--text-primary);
    }

    /* ── Return path: U-shape from Judge back to Writer ── */
    .return-path {
      position: relative;
      margin-top: var(--space-md);
      height: 42px;
    }

    /* Left vertical riser — back up into Writer, arrowhead pointing up */
    .return-left {
      grid-column: 1;
      justify-self: center;
      width: 3px;
      height: 100%;
      background: var(--accent-purple);
      position: relative;
    }
    .return-left::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 8px solid var(--accent-purple);
    }

    /* Right vertical drop — down out of Judge */
    .return-right {
      grid-column: 5;
      justify-self: center;
      width: 3px;
      height: 100%;
      background: var(--accent-purple);
    }

    /*
     * Dashed bar joining the two verticals.
     * Both insets are half of an outer 180px column = 90px.
     */
    .return-path::after {
      content: '';
      position: absolute;
      bottom: 0;
      height: 3px;
      left: 90px;
      right: 90px;
      background: repeating-linear-gradient(
        to left,
        var(--accent-purple) 0,
        var(--accent-purple) 6px,
        transparent 6px,
        transparent 10px
      );
    }

    /* Label under the return bar, centred on the bar itself */
    .return-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      margin: var(--space-sm) auto 0;
      width: 736px;
      padding-left: 90px;
      padding-right: 90px;
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
    }
    .loop-badge {
      font-size: 9px;
      font-weight: var(--font-weight-semibold);
      color: var(--accent-purple);
      background: var(--accent-purple-bg);
      border: 1px solid var(--accent-purple);
      border-radius: var(--radius-xs);
      padding: 1px 6px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <h2 class="card-title">Writer / Script / Judge State Machine</h2>

      <div class="card-body">
        <div class="spine">

          <!-- Top: the input -->
          <div class="box accent-cyan endpoint">
            <div class="box-title">Recipe</div>
          </div>

          <div class="v-connector">
            <span class="v-label">read</span>
          </div>

          <!-- Middle: the three pieces that iterate -->
          <div class="loop-group">
            <span class="loop-group-label">State machine</span>

            <div class="loop-row">
              <div class="box accent-blue">
                <div class="box-title">Writer</div>
              </div>

              <div class="h-connector">
                <span class="h-connector-label">draft</span>
                <div class="h-connector-line"></div>
              </div>

              <div class="box script">
                <div class="box-title">Script</div>
              </div>

              <div class="h-connector">
                <span class="h-connector-label">draft + metrics</span>
                <div class="h-connector-line"></div>
              </div>

              <div class="box accent-purple">
                <div class="box-title">Judge</div>
              </div>
            </div>

            <!-- Return path: Judge → Writer, carrying scores and fixes -->
            <div class="return-path">
              <div class="return-left"></div>
              <div class="return-right"></div>
            </div>

            <div class="return-label">
              <span>scores + top fixes</span>
              <span class="loop-badge">retry</span>
            </div>
          </div>

          <div class="v-connector">
            <span class="gate-label">score &ge; bar</span>
          </div>

          <!-- Bottom: the output -->
          <div class="box accent-green endpoint">
            <div class="box-title">Final README</div>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
