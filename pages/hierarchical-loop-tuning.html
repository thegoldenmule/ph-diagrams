<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/mode.js"></script>
  <style>
    .card-title {
      margin-bottom: var(--space-lg);
    }
    .frame {
      max-width: 1180px;
    }
    .card {
      height: auto;
    }
    .card-body {
      flex: none;
    }

    /* Vertical spine: feedback on top, nested machines in the middle, README below */
    .spine {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Shared box style */
    .box {
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: var(--space-lg) var(--space-md);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .box.accent-cyan   { border-color: var(--accent-cyan);   background: var(--accent-cyan-bg);   color: var(--accent-cyan); }
    .box.accent-blue   { border-color: var(--accent-blue);   background: var(--accent-blue-bg);   color: var(--accent-blue); }
    .box.accent-green  { border-color: var(--accent-green);  background: var(--accent-green-bg);  color: var(--accent-green); }
    .box.accent-purple { border-color: var(--accent-purple); background: var(--accent-purple-bg); color: var(--accent-purple); }

    .box-title {
      font-size: 15px;
      font-weight: var(--font-weight-semibold);
    }

    /* Spine endpoints get a fixed width so the column reads as one axis */
    .box.endpoint {
      width: 200px;
    }

    /*
     * The script is not an agent — neutral fill and a monospace label so it
     * reads as deterministic machinery next to the coloured LLM boxes.
     */
    .box.script {
      border-color: var(--border-glass);
      background: var(--bg-elevated);
      color: var(--text-primary);
    }
    .box.script .box-title {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 14px;
      letter-spacing: var(--letter-spacing-normal);
    }

    /* ── Vertical spine connector ── */
    .v-connector {
      position: relative;
      width: 3px;
      height: 38px;
      background: var(--text-primary);
      flex-shrink: 0;
    }
    .v-connector::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid var(--text-primary);
    }
    /* Label sits beside the vertical line so it never covers the arrow */
    .v-label {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
    }

    /* Group labels for both nesting levels */
    .group-label {
      position: absolute;
      top: -8px;
      left: var(--space-lg);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--bg-surface);
      padding: 0 var(--space-sm);
      white-space: nowrap;
    }

    /*
     * ── Outer superstate: the machine that rewrites the machine ──
     * Solid border and a lifted fill so it reads as the containing state,
     * with the inner machine drawn dashed inside it.
     */
    .outer-loop {
      position: relative;
      width: 100%;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.02);
      padding: var(--space-lg);
    }

    /*
     * Outer row at a 1180px viewport:
     * content = 1180 - 48 (frame) - 2 (card border) - 64 (card padding) = 1066px
     * outer-loop inner width = 1066 - 48 (padding) - 2 (border) = 1016px
     * 170 (Tuner) + 126 (arrow) + 1fr = 1016 - 28 (2 x 14px gaps) → 1fr = 692px
     */
    .outer-row {
      display: grid;
      grid-template-columns: 170px 126px 1fr;
      column-gap: 14px;
      align-items: center;
    }

    /* ── Inner substate: the writer/script/judge machine ── */
    .inner-loop {
      position: relative;
      border: 1px dashed var(--border-glass);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
    }

    /*
     * Both inner rows share the same fixed column template so the return-path
     * verticals land dead-centre under the boxes above them.
     * inner-loop inner width = 692 - 48 (padding) - 2 (border) = 642px
     * 150 + 40 + 150 + 96 + 150 = 586, + 4 x 14px gaps = 642.
     */
    .loop-row, .return-path {
      display: grid;
      grid-template-columns: 150px 40px 150px 96px 150px;
      column-gap: 14px;
      width: 642px;
      margin-left: auto;
      margin-right: auto;
    }

    .loop-row {
      align-items: stretch;
    }

    /* Horizontal connector arrow with label above it */
    .h-connector {
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .h-connector-label {
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
    }
    .h-connector-line {
      width: 100%;
      height: 3px;
      background: var(--text-primary);
      position: relative;
    }
    .h-connector-line::after {
      content: '';
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 8px solid var(--text-primary);
    }

    /* ── Inner return path: U-shape from Judge back to Writer ── */
    .return-path {
      position: relative;
      margin-top: var(--space-md);
      height: 40px;
    }
    .return-left {
      grid-column: 1;
      justify-self: center;
      width: 3px;
      height: 100%;
      background: var(--accent-purple);
      position: relative;
    }
    .return-left::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 8px solid var(--accent-purple);
    }
    .return-right {
      grid-column: 5;
      justify-self: center;
      width: 3px;
      height: 100%;
      background: var(--accent-purple);
    }
    /* Both insets are half of an outer 150px column = 75px. */
    .return-path::after {
      content: '';
      position: absolute;
      bottom: 0;
      height: 3px;
      left: 75px;
      right: 75px;
      background: repeating-linear-gradient(
        to left,
        var(--accent-purple) 0,
        var(--accent-purple) 6px,
        transparent 6px,
        transparent 10px
      );
    }
    .return-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      margin: var(--space-sm) auto 0;
      width: 642px;
      padding-left: 75px;
      padding-right: 75px;
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
    }
    .loop-badge {
      font-size: 9px;
      font-weight: var(--font-weight-semibold);
      color: var(--accent-purple);
      background: var(--accent-purple-bg);
      border: 1px solid var(--accent-purple);
      border-radius: var(--radius-xs);
      padding: 1px 6px;
      letter-spacing: 0.04em;
    }

    /*
     * ── Outer return path: the Judge's verdict back up to the Tuner ──
     * Spans the outer-loop content box, so both ends are fixed offsets:
     *   riser = centre of the 170px Tuner column          = 85px from the left
     *   drop  = centre of the Judge box inside inner-loop = 25 (inner padding
     *           + border) + 75 (half a 150px column)      = 100px from the right
     */
    .outer-return {
      position: relative;
      height: 46px;
      margin-top: var(--space-md);
    }
    .outer-riser {
      position: absolute;
      left: 83.5px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent-cyan);
    }
    .outer-riser::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 8px solid var(--accent-cyan);
    }
    .outer-drop {
      position: absolute;
      right: 98.5px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent-cyan);
    }
    .outer-return::after {
      content: '';
      position: absolute;
      bottom: 0;
      height: 3px;
      left: 85px;
      right: 100px;
      background: repeating-linear-gradient(
        to left,
        var(--accent-cyan) 0,
        var(--accent-cyan) 6px,
        transparent 6px,
        transparent 10px
      );
    }
    .outer-return-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      margin-top: var(--space-sm);
      padding-left: 85px;
      padding-right: 100px;
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
    }
    .retune-badge {
      font-size: 9px;
      font-weight: var(--font-weight-semibold);
      color: var(--accent-cyan);
      background: var(--accent-cyan-bg);
      border: 1px solid var(--accent-cyan);
      border-radius: var(--radius-xs);
      padding: 1px 6px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <h2 class="card-title">Hierarchical State Machine</h2>

      <div class="card-body">
        <div class="spine">

          <!-- Top: the human's feedback on the finished READMEs -->
          <div class="box accent-cyan endpoint">
            <div class="box-title">My Feedback</div>
          </div>

          <div class="v-connector">
            <span class="v-label">read</span>
          </div>

          <!-- Outer superstate: iterate on the machine itself -->
          <div class="outer-loop">
            <span class="group-label">Outer state machine</span>

            <div class="outer-row">
              <div class="box accent-blue">
                <div class="box-title">Tuner</div>
              </div>

              <div class="h-connector">
                <span class="h-connector-label">rewrites the machine</span>
                <div class="h-connector-line"></div>
              </div>

              <!-- Inner substate: run the machine as it currently stands -->
              <div class="inner-loop">
                <span class="group-label">Inner state machine</span>

                <div class="loop-row">
                  <div class="box accent-blue">
                    <div class="box-title">Writer</div>
                  </div>

                  <div class="h-connector">
                    <span class="h-connector-label">draft</span>
                    <div class="h-connector-line"></div>
                  </div>

                  <div class="box script">
                    <div class="box-title">Script</div>
                  </div>

                  <div class="h-connector">
                    <span class="h-connector-label">draft + metrics</span>
                    <div class="h-connector-line"></div>
                  </div>

                  <div class="box accent-purple">
                    <div class="box-title">Judge</div>
                  </div>
                </div>

                <div class="return-path">
                  <div class="return-left"></div>
                  <div class="return-right"></div>
                </div>

                <div class="return-label">
                  <span>scores + top fixes</span>
                  <span class="loop-badge">retry</span>
                </div>
              </div>
            </div>

            <!-- Outer return: the machine's output still misses the feedback -->
            <div class="outer-return">
              <div class="outer-riser"></div>
              <div class="outer-drop"></div>
            </div>

            <div class="outer-return-label">
              <span>feedback still unmet &mdash; change the spec, rubric, or script</span>
              <span class="retune-badge">retune</span>
            </div>
          </div>

          <div class="v-connector"></div>

          <!-- Bottom: what the inner machine emits, once the feedback is met -->
          <div class="box accent-green endpoint">
            <div class="box-title">README</div>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
