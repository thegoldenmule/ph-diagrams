<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/mode.js"></script>
  <style>
    .card-title {
      margin-bottom: var(--space-lg);
    }
    .frame {
      max-width: 1100px;
    }
    .card {
      height: auto;
    }
    .card-body {
      flex: none;
    }

    /* Shared box style */
    .box {
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: var(--space-lg) var(--space-md);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .box.accent-cyan   { border-color: var(--accent-cyan);   background: var(--accent-cyan-bg);   color: var(--accent-cyan); }
    .box.accent-blue   { border-color: var(--accent-blue);   background: var(--accent-blue-bg);   color: var(--accent-blue); }
    .box.accent-green  { border-color: var(--accent-green);  background: var(--accent-green-bg);  color: var(--accent-green); }
    .box.accent-purple { border-color: var(--accent-purple); background: var(--accent-purple-bg); color: var(--accent-purple); }

    .box-title {
      font-size: 15px;
      font-weight: var(--font-weight-semibold);
    }

    /*
     * Both rows share the same fixed column template so the return-path
     * verticals land dead-centre under the boxes above them.
     * Content width at a 1100px viewport = 1100 - 48 (frame) - 64 (card) = 988px.
     * 165 + 44 + 190 + 44 + 190 + 100 + 165 = 898, + 6 x 14px gaps = 982.
     */
    .top-row, .return-path {
      display: grid;
      grid-template-columns: 165px 44px 190px 44px 190px 100px 165px;
      column-gap: 14px;
      /* Pinned width so both rows share an identical origin and the
         return-path insets below land exactly under the box centres. */
      width: 982px;
      margin-left: auto;
      margin-right: auto;
    }

    .top-row {
      align-items: stretch;
    }

    /* Horizontal connector arrow with label above it */
    .h-connector {
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .h-connector-label {
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
    }
    .h-connector-line {
      width: 100%;
      height: 3px;
      background: var(--text-primary);
      position: relative;
    }
    .h-connector-line::after {
      content: '';
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 8px solid var(--text-primary);
    }

    /* The exit gate rides on the last forward arrow */
    .gate-label {
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--accent-green);
      background: var(--accent-green-bg);
      border: 1px solid var(--accent-green);
      border-radius: var(--radius-xs);
      padding: 2px 7px;
      letter-spacing: 0.03em;
      white-space: nowrap;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }


    /* ── Return path: U-shape from Judge back to Writer ── */
    .return-path {
      position: relative;
      margin-top: var(--space-md);
      height: 46px;
    }

    /* Left vertical riser — back up into Writer, arrowhead pointing up */
    .return-left {
      grid-column: 3;
      justify-self: center;
      width: 3px;
      height: 100%;
      background: var(--accent-purple);
      position: relative;
    }
    .return-left::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 8px solid var(--accent-purple);
    }

    /* Right vertical drop — down out of Judge */
    .return-right {
      grid-column: 5;
      justify-self: center;
      width: 3px;
      height: 100%;
      background: var(--accent-purple);
    }

    /*
     * Dashed bar joining the two verticals.
     * left  inset = col1 + gap + col2 + gap + col3/2 = 165+14+44+14+95 = 332px
     * right inset = col7 + gap + col6 + gap + col5/2 = 165+14+100+14+95 = 388px
     */
    .return-path::after {
      content: '';
      position: absolute;
      bottom: 0;
      height: 3px;
      left: 332px;
      right: 388px;
      background: repeating-linear-gradient(
        to left,
        var(--accent-purple) 0,
        var(--accent-purple) 6px,
        transparent 6px,
        transparent 10px
      );
    }

    /* Label under the return bar, centred on the bar itself */
    .return-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      margin: var(--space-sm) auto 0;
      width: 982px;
      padding-left: 332px;
      padding-right: 388px;
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap;
    }
    .loop-badge {
      font-size: 9px;
      font-weight: var(--font-weight-semibold);
      color: var(--accent-purple);
      background: var(--accent-purple-bg);
      border: 1px solid var(--accent-purple);
      border-radius: var(--radius-xs);
      padding: 1px 6px;
      letter-spacing: 0.04em;
    }

  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <h2 class="card-title">Writer / Judge State Machine</h2>

      <div class="card-body">

        <!-- Row 1: Source → Writer → Judge → Final README -->
        <div class="top-row">
          <div class="box accent-cyan">
            <div class="box-title">Recipe</div>
          </div>

          <div class="h-connector">
            <span class="h-connector-label">read</span>
            <div class="h-connector-line"></div>
          </div>

          <div class="box accent-blue">
            <div class="box-title">Writer</div>
          </div>

          <div class="h-connector">
            <span class="h-connector-label">draft</span>
            <div class="h-connector-line"></div>
          </div>

          <div class="box accent-purple">
            <div class="box-title">Judge</div>
          </div>

          <div class="h-connector">
            <span class="gate-label">score &ge; bar</span>
            <div class="h-connector-line"></div>
          </div>

          <div class="box accent-green">
            <div class="box-title">Final README</div>
          </div>
        </div>

        <!-- Return path: Judge → Writer, carrying scores and fixes -->
        <div class="return-path">
          <div class="return-left"></div>
          <div class="return-right"></div>
        </div>

        <div class="return-label">
          <span>scores + top fixes</span>
          <span class="loop-badge">retry</span>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
