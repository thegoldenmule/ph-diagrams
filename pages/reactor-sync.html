<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .frame {
      max-width: 1060px;
    }
    .card {
      height: auto;
    }
    .card-title {
      margin-bottom: var(--space-xl);
    }
    .card-body {
      flex: none;
    }

    /* ── Boxes: a title only ── */
    .box {
      position: relative;
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 12px 12px;
      text-align: center;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .box.accent-cyan   { border-color: var(--accent-cyan);   background: var(--accent-cyan-bg);   color: var(--accent-cyan); }
    .box.accent-blue   { border-color: var(--accent-blue);   background: var(--accent-blue-bg);   color: var(--accent-blue); }
    .box.accent-green  { border-color: var(--accent-green);  background: var(--accent-green-bg);  color: var(--accent-green); }
    .box.accent-purple { border-color: var(--accent-purple); background: var(--accent-purple-bg); color: var(--accent-purple); }
    .box-title {
      font-size: 14px;
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-tight);
    }
    .mono {
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: var(--letter-spacing-normal);
    }
    .box-title.mono { font-size: 13px; }

    /* Optional or alternative wiring: dashed, tagged with its builder call */
    .variant {
      border-style: dashed;
      background: transparent;
    }
    .variant-tag {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 9.5px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: var(--letter-spacing-normal);
      border: 1px dashed currentColor;
      border-radius: var(--radius-xs);
      padding: 1px 6px;
      opacity: 0.9;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
    }
    .chip {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: var(--letter-spacing-normal);
      border: 1px solid currentColor;
      border-radius: var(--radius-xs);
      padding: 2px 6px;
      white-space: nowrap;
      opacity: 0.85;
    }

    /* ── Groups ── */
    .group {
      position: relative;
      border: 1px dashed var(--border-glass);
      border-radius: var(--radius-md);
      padding: 22px 16px 16px;
    }
    .group-label {
      position: absolute;
      top: -8px;
      left: 14px;
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--bg-surface);
      padding: 0 var(--space-sm);
      white-space: nowrap;
    }
    .group-label.right { left: auto; right: 14px; }

    /* ── Wires ── */
    svg.wires {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }
    svg.wires > path { fill: none; stroke-width: 2; }
    svg.wires .w-call  { stroke: var(--text-primary); }
    svg.wires .w-event { stroke: var(--accent-green); }
    svg.wires .w-dash  { stroke: rgba(255,255,255,0.6); stroke-dasharray: 5 4; }
    svg.wires text {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 10px;
      font-weight: 600;
      fill: rgba(255, 255, 255, 0.6);
    }
    svg.wires rect.label-bg { fill: var(--bg-surface); }

    /* ── Layout ── */
    .diagram {
      position: relative;
      display: grid;
      grid-template-columns: 170px 220px 140px 1fr;
      column-gap: 84px;
      row-gap: 24px;
      margin-top: 8px;
    }
    .frame-col {
      grid-row: 1 / 5;
      border: 1px dashed var(--border-glass);
      border-radius: var(--radius-md);
      margin: -14px -14px;
      position: relative;
    }
    .state-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 22px 12px 12px;
    }
    .state-grid .box { padding: 9px 6px; }
    .state-grid .box-title { font-size: 12px; }

    .types-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 170px;
      column-gap: 72px;
      align-items: center;
      margin-top: 44px;
    }
    .types {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .mailbox { align-self: center; padding: 16px 12px; }
    .types .box-title.mono { font-size: 12px; }
  </style>
</head>
<body>
  <!--
    Element → source map (paths relative to packages/reactor/src unless prefixed reactor-api/).
    Line numbers as of main a30562aeca. All edges share one colour; dashed marks the channel transport.

    SyncManager ............... sync/sync-manager.ts; built by sync/sync-builder.ts:131 (core/reactor-builder.ts:1402, :1415)
    JOB_WRITE_READY · trigger . sync-manager.ts:592-595 (enqueueWriteReady)
    BatchAggregator ........... sync/batch-aggregator.ts:32; holds a batch until all batchJobIds arrive :127-142
    batch ..................... sync-manager.ts:2337 processCompleteBatch
    (SettledWatermark is not drawn, matching the components view; settledThrough bounds the "settled" edge below)
    Operation index · settled . cache/kysely-operation-index.ts:158; sync-manager.ts:3474 (throughOrdinal = settledThrough), :3482-3491
    Derive outbox ............. sync-manager.ts:3463 deriveOutbox; filters :3517-3535; emitBatches :3412
    add ....................... sync-manager.ts:3459 outbox.add
    Apply inbox ............... sync-manager.ts:2488 handleInboxAdded; ack on WRITE_READY :2368, sync/utils.ts:28
    onAdded ................... sync-manager.ts:2116-2118
    load ...................... sync-manager.ts:2863 reactor.load, :3064 reactor.loadBatch
    IReactor .................. core/types.ts:138; core/reactor.ts:717 load, :873 loadBatch
    outbox · inbox · deadLetter sync/interfaces.ts:37-102; sync/mailbox.ts:75
    send / receive ............ channels/gql-req-channel.ts:1382 (pushSyncEnvelopes), :1022 (pollSyncEnvelopes); channels/local-channel.ts:73
    Sync state
      Holds ................... sync-manager.ts:966 hold (SYNC_HELD), :1049 releaseSupported (SYNC_RELEASED)
        hold .................. deriveOutbox → gateOutbound (sync-manager.ts:3536) → this.hold for documents the peer's protocol
                                versions cannot run (:1207-1230). Holds also come from peer manifests (:754) and inbox skew (:1133)
      Dead letters ............ sync-manager.ts:2234 (persisted), :2268 (reloaded)
        persist ............... sync-manager.ts:2148 deadLetter.onAdded, :2234, DEAD_LETTER_ADDED :2247
      Purge refusals .......... sync/purge-refusals.ts:8; sync-manager.ts:828 persistRefusals, :843 (PURGE_REFUSED)
        refuse ................ sync-manager.ts:2173-2181: an outbox dead letter typed MARKER_REFUSED (the peer refused our tombstone)
                                becomes a purge refusal via recordPurgeRefusal (:798). Also from poll reports (:802)
    Remote reactors [stack] ... sync/sync-manager.ts:312 (remotes: Map<string, Remote>)
    Channel types · implements  each class implements IChannel (sync/interfaces.ts:37-102)
      GqlRequestChannel ....... channels/gql-req-channel.ts:160 (touchChannel :1124)
      LocalChannel ............ channels/local-channel.ts:73; channels/local-channel-factory.ts:27
      GqlResponseChannel ...... channels/gql-res-channel.ts:23; reactor-api/src/graphql/reactor/resolvers.ts:2214, :1803
      SyncScopeGate · filters . decision/sync-scope-gate.ts:20, :41; reactor-api/src/services/sync-serving-gate.ts:40-48;
                                applied reactor-api/src/graphql/reactor/resolvers.ts:1754-1767 (never inside packages/reactor)
                                Coloured external grey: reactor-api applies it outside the reactor, so it is not in the client family
  -->
  <div class="frame">
    <div class="card">
      <h2 class="card-title">Reactor Sync</h2>

      <div class="card-body">
        <div id="diagram" style="position:relative">
        <svg class="wires" id="wires"></svg>
        <div class="diagram">

          <div class="grp-sync frame-col" style="grid-column:2"><span class="group-label">SyncManager</span></div>
          <div class="grp-sync frame-col" id="chan-frame" style="grid-column:3"><span class="group-label">Channel</span></div>

          <div class="box fam-reactor-bus" id="ev" style="grid-column:1;grid-row:1"><div class="box-title mono">JOB_WRITE_READY</div></div>
          <div class="box fam-sync" id="agg" style="grid-column:2;grid-row:1"><div class="box-title">BatchAggregator</div></div>

          <div class="box fam-storage-index" id="oi" style="grid-column:1;grid-row:2"><div class="box-title">Operation index</div></div>
          <div class="box fam-sync" id="derive" style="grid-column:2;grid-row:2"><div class="box-title">Derive outbox</div></div>
          <div class="box mailbox fam-sync-channel" id="outbox" style="grid-column:3;grid-row:2"><div class="box-title mono">outbox</div></div>
          <div class="fanout dashed fam-external" id="remote" style="grid-column:4;grid-row:2 / 5;margin-top:0"><div class="box variant fam-external"><div class="box-title">Remote reactors</div></div></div>

          <div class="grp-sync group state-grid" id="state" style="grid-column:2;grid-row:3">
            <span class="group-label">Sync state</span>
            <div class="box fam-sync-state" id="holds"><div class="box-title">Holds</div></div>
            <div class="box fam-sync-state" id="deadletters"><div class="box-title">Dead letters</div></div>
            <div class="box fam-sync-state" id="refusals"><div class="box-title">Purge refusals</div></div>
          </div>
          <div class="box mailbox fam-sync-channel" id="dead" style="grid-column:3;grid-row:3;align-self:end;margin-bottom:12px;height:74px"><div class="box-title mono">deadLetter</div></div>

          <div class="box fam-reactor-facade" id="reactor" style="grid-column:1;grid-row:4"><div class="box-title mono">IReactor</div></div>
          <div class="box fam-sync" id="apply" style="grid-column:2;grid-row:4"><div class="box-title">Apply inbox</div></div>
          <div class="box mailbox fam-sync-channel" id="inbox" style="grid-column:3;grid-row:4"><div class="box-title mono">inbox</div></div>
        </div>
        <div class="types-row" id="types-row">
          <div class="grp-sync group types" id="types">
            <span class="group-label">Channel types</span>
            <div class="box fam-sync-channel" id="gqlreq"><div class="box-title mono">GqlRequestChannel</div></div>
            <div class="box fam-sync-channel" id="localch"><div class="box-title mono">LocalChannel</div></div>
            <div class="box fam-sync-channel" id="gqlres"><div class="box-title mono">GqlResponseChannel</div></div>
          </div>
          <div class="box fam-external" id="gate"><div class="box-title">SyncScopeGate</div></div>
        </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Orthogonal wires drawn over the grid from element rects. Redrawn on
    // resize and once web fonts load, so label widths never shift a box away
    // from its wire.
    const NS = 'http://www.w3.org/2000/svg';

    function wires(R) {
      const ev = R('ev'), agg = R('agg'), oi = R('oi'), d = R('derive');
      const ob = R('outbox'), rm = R('remote'), re = R('reactor'), ap = R('apply');
      const ib = R('inbox'), dl = R('dead');
      const ho = R('holds'), dls = R('deadletters'), pr = R('refusals');
      const gr = R('gqlres'), gt = R('gate'), cf = R('chan-frame'), ty = R('types');
      return [
        { cls: 'w-call', pts: [[ev.r, ev.cy], [agg.l, ev.cy]], label: 'trigger', seg: 0 },
        { cls: 'w-call', pts: [[agg.cx, agg.b], [agg.cx, d.t]], label: 'batch', seg: 0 },
        { cls: 'w-call', pts: [[oi.r, d.cy], [d.l, d.cy]], label: 'settled', seg: 0 },
        { cls: 'w-call', pts: [[d.r, ob.cy], [ob.l, ob.cy]], label: 'add', seg: 0 },
        { cls: 'w-call', pts: [[d.cx, d.b], [d.cx, ho.t]], label: 'hold', seg: 0, at: 0.22 },
        { cls: 'w-dash', pts: [[ob.r, ob.cy], [rm.l, ob.cy]], label: 'send', seg: 0 },
        { cls: 'w-dash', pts: [[rm.l, ib.cy], [ib.r, ib.cy]], label: 'receive', seg: 0 },
        { cls: 'w-call', pts: [[ib.l, ib.cy], [ap.r, ib.cy]], label: 'onAdded', seg: 0 },
        { cls: 'w-call', pts: [[ap.l, ap.cy], [re.r, ap.cy]], label: 'load', seg: 0 },
        { cls: 'w-call', pts: [[dl.l, dls.cy], [dls.r, dls.cy]], label: 'persist', seg: 0 },
        { cls: 'w-call', pts: [[dl.l, pr.cy], [pr.r, pr.cy]], label: 'refuse', seg: 0 },
        { cls: 'w-call', pts: [[gt.l, gt.cy], [gr.r, gt.cy]], label: 'filters', seg: 0 },
        { cls: 'w-call', pts: [[cf.cx, ty.t], [cf.cx, cf.b]], label: 'implements', seg: 0 },
      ];
    }

    function draw() {
      const host = document.getElementById('diagram');
      const svg = document.getElementById('wires');
      const hr = host.getBoundingClientRect();
      svg.setAttribute('width', hr.width);
      svg.setAttribute('height', hr.height);
      svg.innerHTML = '';
      const defs = document.createElementNS(NS, 'defs');
      for (const [id, color] of [['ah-call', '#ffffff'], ['ah-event', '#07c262'], ['ah-dash', 'rgba(255,255,255,0.6)']]) {
        const m = document.createElementNS(NS, 'marker');
        m.setAttribute('id', id);
        m.setAttribute('viewBox', '0 0 10 10');
        m.setAttribute('refX', '9');
        m.setAttribute('refY', '5');
        m.setAttribute('markerWidth', '7');
        m.setAttribute('markerHeight', '7');
        m.setAttribute('markerUnits', 'userSpaceOnUse');
        m.setAttribute('orient', 'auto-start-reverse');
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', 'M0,0 L10,5 L0,10 Z');
        p.setAttribute('fill', color);
        m.appendChild(p);
        defs.appendChild(m);
      }
      svg.appendChild(defs);

      const R = (id) => {
        const r = document.getElementById(id).getBoundingClientRect();
        const l = r.left - hr.left, t = r.top - hr.top;
        return { l, t, r: l + r.width, b: t + r.height, w: r.width, h: r.height, cx: l + r.width / 2, cy: t + r.height / 2 };
      };

      for (const w of wires(R)) {
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', w.pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join(' '));
        path.setAttribute('class', w.cls);
        path.setAttribute('marker-end', `url(#ah-${w.cls.slice(2)})`);
        if (w.both) path.setAttribute('marker-start', `url(#ah-${w.cls.slice(2)})`);
        svg.appendChild(path);
        if (!w.label) continue;
        const [a, z] = [w.pts[w.seg], w.pts[w.seg + 1]];
        const text = document.createElementNS(NS, 'text');
        text.textContent = w.label;
        svg.appendChild(text);
        const tw = text.getComputedTextLength();
        let x, y;
        if (a[0] === z[0]) {
          y = a[1] + (z[1] - a[1]) * (w.at ?? 0.5) + 3.5;
          x = w.lx === 'left' ? a[0] - 8 - tw : a[0] + 8;
        } else {
          x = (a[0] + z[0]) / 2 - tw / 2;
          y = a[1] - 7;
        }
        text.setAttribute('x', x);
        text.setAttribute('y', y);
        const bg = document.createElementNS(NS, 'rect');
        bg.setAttribute('class', 'label-bg');
        bg.setAttribute('x', x - 3);
        bg.setAttribute('y', y - 10);
        bg.setAttribute('width', tw + 6);
        bg.setAttribute('height', 13);
        svg.insertBefore(bg, text);
      }
    }
    draw();
    window.addEventListener('resize', draw);
    document.fonts.ready.then(draw);
  </script>
</body>
</html>
